# Makers: headstamp layouts and finishes, drawn per copy.
#
# Every copy draws one maker, weighted per cartridge. The maker sets the headstamp, the case
# and primer finish, the primer sealant, the annealing stain, the age (tarnish) and, for
# loaded rounds, the bullet jacket and tip paint. Commercial marks here are made up. "LC" is
# the US Army's Lake City plant; the Eastern-bloc numbers are arsenal codes, not brands.
#
# Where a maker applies: `weight` for every cartridge of `classes` (pistol, rifle, rimfire),
# and/or `weights = { cartridge = weight }` per cartridge (these win).
#
# Choices are tables of { option = weight }; ranges are [min, max].
#
# marks: text or a symbol centred at a clock position (12 top, 3 right, 6 bottom, 9 left;
#   0 = centre, rimfire only, raised). Text in the top half reads clockwise with the letter
#   bottoms toward the primer; in the bottom half it reads counter-clockwise, upright.
#   Placeholders: {caliber} and {military} (the spec's [headstamp]), {yy} (two-digit year
#   from `years`), {code} (one of `codes`). Symbols: nato (circled cross), ring, dot.
# dots: how many extra dots (lot / month marks) go in free spots.
# primer_crimp: none, ring (a staked ring around the pocket) or stakes (three stab marks).
# age: tarnish range. New ammo gets at least the "new" condition's factory tarnish anyway,
#   unless the maker is `pristine = true`: showroom-clean cases and bright bullets (keep one
#   pristine maker per cartridge). Fired brass ages the same for every maker.
# jacket: bullet jacket metal, e.g. gilding-metal (drawn FMJ), brass (brass-jacketed, as
#   bright as the case), copper (plated: duller, tarnishes sooner).
# anneal_colour: { plain = w, rainbow = w }. Plain is the usual brown to blue-grey stain;
#   rainbow is heat tint, an oxide film thin enough to show faint interference colours.
# style: letters' stroke `weight` (fraction of letter height added to each side), `width`
#   (horizontal scale), `size` (scale on the default letter height), `depth` (scale).

[sealants]  # primer sealant lacquer, linear RGB
purple = [0.08, 0.012, 0.11]
red = [0.22, 0.008, 0.006]
magenta = [0.34, 0.015, 0.12]
blue = [0.008, 0.04, 0.25]
green = [0.01, 0.12, 0.075]

[paints]  # bullet tip paint, linear RGB
green = [0.012, 0.07, 0.02]
lightgreen = [0.05, 0.17, 0.05]
red = [0.30, 0.02, 0.006]

[[maker]]
key = "cmx"
name = "CMX (placeholder commercial)"
classes = ["pistol", "rifle"]
weight = 3
marks = [{ text = "CMX", at = 12 }, { text = "{caliber}", at = 6 }]
case = { brass = 9, nickel = 2 }
primer = { nickel = 2, brass = 1 }
sealant = { none = 6, blue = 1, green = 1 }
smear = [0.0, 0.5]
age = [0.0, 0.35]
style = { weight = 0.03 }

