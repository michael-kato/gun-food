# .308 Winchester. Millimetres; case values are SAAMI maximums.
name = ".308 Winchester"
key = "308"
class = "rifle"
order = 7

[case]
length = 51.18          # 2.015 -.020 in
length_tol = 0.51
base_dia = 11.946       # .4703 in
mouth_dia = 8.725       # .3435 in
shoulder_dia = 11.532   # .4540 in
shoulder_start = 39.620 # 1.5598 in
neck_start = 43.475     # 1.7116 in
body_dia_tol = 0.20     # -.008 in
headspace_tol = 0.178   # -.007 in
rim_dia = 12.01         # .473 -.010 in
rim_dia_tol = 0.25
rim_thickness = 1.37    # .054 -.010 in
rim_thickness_tol = 0.25
groove_dia = 10.39      # .409 -.020 in
groove_dia_tol = 0.51
rim_bevel = 0.38       # rim front bevel at 35 deg: SAAMI rim .054 - land .039 in
rim_bevel_angle = 35    # SAAMI 35 deg +20, from the case axis
groove_front_angle = 36  # groove ramp to the body: SAAMI 36 deg -6
primer = "large-rifle"
web = 2.6
mouth_wall = 0.33

[loaded]
bullet = "308-150-fmjbt"
bullet_dia_max = 7.85   # .309 -.003 in
oal_min = 63.25         # 2.490 in
oal_max = 71.37         # 2.810 in
crimp = "roll"
crimp_amount = 0.15
crimp_length = 0.6
approx = ["crimp_amount"]

[headstamp]
caliber = "308 WIN"            # as commercial makers stamp it; makers.toml adds the rest
military = "7.62"

[sources]
case = "ANSI/SAAMI Z299.4-2025, 308 Winchester cartridge drawing (rev. 06/03/2022) — https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf"
