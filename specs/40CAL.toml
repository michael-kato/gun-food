# .40 S&W. Millimetres; case values are SAAMI maximums.
name = ".40 S&W"
key = "40CAL"
class = "pistol"
order = 4

[case]
length = 21.59          # .850 -.010 in
length_tol = 0.25
base_dia = 10.77        # .424 in
mouth_dia = 10.74       # .423 in
body_dia_tol = 0.20     # -.008 in
rim_dia = 10.77         # .424 -.010 in
rim_dia_tol = 0.25
rim_thickness = 1.40    # .055 -.010 in
rim_thickness_tol = 0.25
groove_dia = 8.81       # .347 -.020 in
groove_dia_tol = 0.51
primer = "small-pistol"
web = 1.6
approx = ["groove_dia"]

[loaded]
bullet = "400-180-fmj-fp"
bullet_dia_max = 10.173 # .4005 -.003 in
oal = 28.58             # typical factory 180 gr FMJ (1.125 in)
oal_min = 27.56         # 1.085 in
oal_max = 28.83         # 1.135 in
crimp = "taper"
crimp_amount = 0.06
crimp_length = 2.5
approx = ["oal", "crimp_amount"]

[headstamp]
top = "CMX"
bottom = "40 S&W"

[sources]
case = "ANSI/SAAMI Z299.3-2022, 40 S&W cartridge drawing (rev. 07/09/2021) — https://saami.org/wp-content/uploads/2025/05/SAAMI-Z299.3-2022-Centerfire-Pistol-Revolver-Approved-12-13-2022.pdf"
groove = "read from the drawing text; its position on the drawing was not checked"
crimp = "taper crimp to about bullet + 2 walls - .004 in — https://www.handgunsmag.com/editorial/squeeze-play-how-to-properly-crimp-ammunition/138116"
