class = "pistol"
order = 3

[case]
length = 22.81          # .898 -.010 in
length_tol = 0.25
base_dia = 12.090       # .4760 in
mouth_dia = 12.014      # .4730 in
body_dia_tol = 0.15     # -.006 in
rim_dia = 12.19         # .480 -.010 in
rim_dia_tol = 0.25
rim_thickness = 1.24    # .049 -.010 in
rim_thickness_tol = 0.25
groove_dia = 10.16      # .400 -.010 in
